<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logs Home</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-row">
        <div>
          <h1>Logs Home</h1>
          <p class="subtitle">Local log viewer — add sources by path, tail latest lines, highlight matches</p>
        </div>
        <span id="app-version" class="app-version" hidden></span>
      </div>
    </header>

    <main class="layout">
      <aside class="panel sources-panel">
        <h2>Sources</h2>
        <form id="source-form" class="source-form">
          <label>
            <span>Name</span>
            <input type="text" id="source-name" placeholder="e.g. ollama logs" required>
          </label>
          <label>
            <span>File path</span>
            <div class="path-input-row">
              <input type="text" id="source-path" placeholder="C:\logs\ollama.log" required>
              <button type="button" id="browse-btn" class="btn-icon" title="Browse for file" aria-label="Browse for file">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
                </svg>
              </button>
            </div>
          </label>
          <button type="submit">Add source</button>
        </form>
        <p id="form-error" class="error" hidden></p>
        <ul id="source-list" class="source-list"></ul>
      </aside>

      <section class="panel viewer-panel">
        <div id="viewer-empty" class="viewer-empty">
          <p>Select a source to view its latest log entries.</p>
        </div>

        <div id="viewer" class="viewer" hidden>
          <div class="viewer-header">
            <div>
              <h2 id="viewer-title"></h2>
              <p id="viewer-path" class="viewer-path"></p>
            </div>
            <div class="viewer-controls">
              <label class="control">
                <span>Lines</span>
                <select id="line-count">
                  <option value="50">50</option>
                  <option value="200" selected>200</option>
                  <option value="500">500</option>
                  <option value="1000">1000</option>
                </select>
              </label>
              <label class="control checkbox">
                <input type="checkbox" id="auto-refresh" checked>
                <span>Auto-refresh</span>
              </label>
              <button type="button" id="refresh-btn" class="btn-secondary">Refresh</button>
            </div>
          </div>

          <div class="highlight-bar">
            <label class="control checkbox">
              <input type="checkbox" id="highlight-enabled">
              <span>Highlight</span>
            </label>
            <label class="control">
              <span>Pattern</span>
              <input type="text" id="highlight-pattern" placeholder="ERR" value="ERR">
            </label>
            <label class="control checkbox">
              <input type="checkbox" id="highlight-case-sensitive">
              <span>Case sensitive</span>
            </label>
            <div class="presets">
              <span class="presets-label">Presets:</span>
              <button type="button" class="preset" data-pattern="ERR">ERR</button>
              <button type="button" class="preset" data-pattern="ERROR">ERROR</button>
              <button type="button" class="preset" data-pattern="WARN">WARN</button>
              <button type="button" class="preset" data-pattern="FATAL">FATAL</button>
            </div>
          </div>

          <div id="log-output" class="log-output" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
